version: "1.0"

# The dev fixtures (src/app/session_forms_demo and src/app/tool_approval_demo)
# are removed from the registry unless their profile is selected, so a release
# has no fixture agents, provider, model or endpoint. See README.md.
disable:
  namespaces:
    - app.session_forms_demo
    - app.tool_approval_demo

profiles:
  session-forms-fixtures:
    disable:
      namespaces.remove:
        - app.session_forms_demo
  tool-approval-fixtures:
    disable:
      namespaces.remove:
        - app.tool_approval_demo
