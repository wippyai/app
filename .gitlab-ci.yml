stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "22"

Lint:
  stage: lint
  image: ubuntu:22.04
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && . /tmp/wippy-install.sh
  script:
    - wippy install
    - wippy lint --level error
  tags:
    - hetzner

Test:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && . /tmp/wippy-install.sh
  script:
    - wippy install
    - wippy test users-test
  tags:
    - hetzner

# The demo tiles build against the tile helper inside the installed
# wippy/dashboards module (make tile-helper), so the frontend jobs need the
# Wippy CLI and `wippy install` before `make build`. Debian-based Node image,
# because the Wippy CLI is not built for Alpine's musl.
Frontend_checks:
  stage: test
  image: node:${NODE_VERSION}-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl make > /dev/null
    # The installer writes ~/.wippy/env but does not change this shell's PATH.
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && WIPPY_NO_MODIFY_PATH=1 sh /tmp/wippy-install.sh
    - . "$HOME/.wippy/env"
    - wippy install
  script:
    # Typecheck and unit tests of the headless sidebar package.
    - make test-pkg-app-nav NPM_INSTALL='npm ci'
    # Lint needs each package's dependencies; the build installs them with npm ci.
    - make build NPM_INSTALL='npm ci'
    - make lint NPM_INSTALL='npm ci'
  tags:
    - hetzner

Build_frontend:
  stage: build
  image: node:${NODE_VERSION}-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl make > /dev/null
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && WIPPY_NO_MODIFY_PATH=1 sh /tmp/wippy-install.sh
    - . "$HOME/.wippy/env"
    - wippy install
  script:
    - make build NPM_INSTALL='npm ci'
  artifacts:
    paths:
      - static/app/
      - static/wc/
    expire_in: 1 hour
  tags:
    - hetzner
