stages:
  - lint
  - test
  - build

variables:
  NODE_VERSION: "22"

Lint:
  stage: lint
  image: ubuntu:22.04
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && . /tmp/wippy-install.sh
  script:
    - wippy install
    - wippy lint --level error
  tags:
    - hetzner

Test:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh && . /tmp/wippy-install.sh
  script:
    - wippy install
    - wippy test users-test
  tags:
    - hetzner

Build_frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache make
  script:
    - make build NPM_INSTALL='npm ci'
  artifacts:
    paths:
      - static/app/
      - static/wc/
    expire_in: 1 hour
  tags:
    - hetzner
