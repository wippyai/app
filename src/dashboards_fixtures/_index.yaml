version: "1.0"
namespace: app.dashboards_fixtures

# Fixtures of the wippy/dashboards browser tests (e2e/dashboards-reads.spec.ts, e2e/dashboards.spec.ts):
# points for each row of the state table of the data point contract (ready, empty, failed,
# wrong data, slow, timeout, mapper failure), for the value rules (decimals, big integers, time
# offsets, empty cells in each type, malformed values), a slow action, the placeholder tiles (now in app.dashboards_fixture_tiles; the
# module no longer ships the dash-placeholder element), and policies for the
# access checks. Every point and tile here sets catalog: false, so the dashboards agent never
# offers them. The point no_schema is invalid on purpose: publication must refuse it.

entries:
  # A regular user may not view the page deny_check.
  - name: deny_view_check
    kind: security.policy
    meta:
      comment: app.security:user may not view the page deny_check
    groups:
      - app.security:user
    policy:
      resources: page:wippy.dashboards.pages:deny_check
      actions: view
      effect: deny

  # A regular user may not view the page reads_denied (RC1-06).
  - name: deny_view_reads
    kind: security.policy
    meta:
      comment: app.security:user may not view the page reads_denied
    groups:
      - app.security:user
    policy:
      resources: page:wippy.dashboards.pages:reads_denied
      actions: view
      effect: deny

  # Access that a test withdraws at run time (RC1-08): the endpoint below changes the effect of this
  # policy between allow and deny, and the next read of a regular user sees it.
  - name: reads_toggle
    kind: security.policy
    meta:
      comment: Lets app.security:user view the page reads_toggle; a test changes the effect to deny at run time
    groups:
      - app.security:user
    policy:
      resources: page:wippy.dashboards.pages:reads_toggle
      actions: view
      effect: allow

  - name: access_toggle
    kind: function.lua
    meta:
      comment: Sets the effect of the policy reads_toggle (admin only), for the access tests
    source: file://access_toggle.lua
    method: handler
    modules:
      - http
      - json
      - security
      - registry
    pool:
      size: 1

  - name: access_toggle.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: app.dashboards_fixtures:access_toggle
    path: /dashboards-fixtures/access

