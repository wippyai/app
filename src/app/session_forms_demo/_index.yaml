# Development fixture for Session Forms tests, not for production.
#
# The whole namespace is removed from the registry by `.wippy.yaml` unless the
# `session-forms-fixtures` profile is selected, so a release has none of these
# entries (no fixture agents, provider, model or endpoint). `wippy run
# --profile session-forms-fixtures` selects it; scripts/run-dev.mjs does so
# when SESSION_FORMS_DEV_FIXTURES=true. Passing `--config` replaces the
# default `.wippy.yaml`, so name it explicitly (`--config .wippy.yaml`) when
# you also pass your own config file, or the gate is off.
#
# Gives the visible tests (M01, M14) a way to trigger a REAL server-side
# artifact mutation through the same Session persistence path the agent
# uses (wippy.session.persist:artifact_repo / :artifact_events), so the Host
# can be observed refreshing off a genuine content_version bump + published
# event — not a client-side fake.
#
# Gated two ways, both required:
#   1. app.env:session_forms_dev_fixtures must be exactly "true" (checked in
#      the handler; anything else answers 404, see env/_index.yaml).
#   2. Caller must be in the app.security:admin group — enforced declaratively
#      by endpoint_firewall via the deny-policy idiom already used for
#      app.security:user in src/app/security/_index.yaml (user.forbid_registry):
#      a broad user-group allow ('*'/'*') is already in place app-wide, so this
#      namespace adds a narrow deny on this one endpoint's own resource id for
#      app.security:user, leaving app.security:admin's existing admin.all_access
#      allow (resources '*', actions '*') as the only policy that still matches.
version: "1.0"
namespace: app.session_forms_demo

entries:
  # --- P2 package D: deterministic local provider + fixture agent ---------
  # Dev fixture only. Backs the "Session forms" demo page's second button
  # (app.session_forms_demo:fixture_agent) with a scripted, offline LLM
  # driver — no external calls, same behavior every run. Never wire
  # app.session_forms_demo:provider/model to a production-facing agent.
  # See generate.lua for the exact request/response behavior.
  - name: generate
    kind: function.lua
    meta:
      type: llm_function
      comment: Deterministic Session Forms demo generator — dev fixture, no external calls
    source: file://generate.lua
    modules:
      - json
      - time
    imports: {}
    method: handler

  - name: status
    kind: function.lua
    meta:
      type: llm_function
      comment: Deterministic Session Forms demo provider status — dev fixture
    source: file://status.lua
    modules: []
    imports: {}
    method: handler

  - name: driver
    kind: contract.binding
    meta:
      name: Session Forms demo driver
      comment: Local deterministic provider used by the Session Forms demo fixture agent — dev fixture, no external calls
      tags:
        - session-forms
        - fixture
    contracts:
      - contract: wippy.llm:generator
        methods:
          generate: app.session_forms_demo:generate
      - contract: wippy.llm:provider
        methods:
          status: app.session_forms_demo:status

  - name: provider
    kind: registry.entry
    meta:
      name: session-forms-demo
      type: llm.provider
      title: Session Forms Demo
      comment: Deterministic local provider for the Session Forms demo fixture agent — dev fixture, no external calls
      tags:
        - session-forms
        - fixture
    driver:
      id: app.session_forms_demo:driver
      options: {}

  - name: model
    kind: registry.entry
    meta:
      name: session-forms-deterministic
      type: llm.model
      title: Session Forms Deterministic
      comment: Deterministic model that exercises the ask_user form flow without a real LLM — dev fixture
      capabilities:
        - generate
        - tool_use
      class:
        - session-forms-fixture
      priority: 100
    max_tokens: 32768
    output_tokens: 4096
    providers:
      - id: app.session_forms_demo:provider
        provider_model: session-forms-deterministic

  # Trait `wippy.session.forms:ask_user` is owned by wippy/session and
  # needs a Session version that ships session forms; with an older one
  # this entry fails to resolve at lint time.
  #
  # agent_options.checkpoint scopes a small checkpoint threshold (and the
  # deterministic fixture model for the summarizer itself) to THIS agent
  # only — see src/process/session_handlers.lua's
  # checkpoint_options_from_agent / resolve_checkpoint_config in the Session
  # source, which reads agent_options.checkpoint.{function_id,token_threshold}
  # off the loaded agent and passes the whole table through as `options` to
  # the checkpoint function (wippy.session.funcs:checkpoint reads
  # options.model there). Not an app-wide env override, so no other agent's
  # checkpoint behavior changes.
  - name: fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-fixture-agent
      type: agent.gen1
      title: Session Forms Fixture
      comment: Deterministic fixture agent for the Session Forms demo — dev fixture, no external calls
      icon: tabler:flask
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent used for demos
      and tests. Say "ask me" to receive a delivery-preference form, or
      answer one to get a confirmation.
    model: session-forms-deterministic
    max_tokens: 4096
    traits:
      - id: wippy.session.forms:ask_user
    agent_options:
      checkpoint:
        function_id: wippy.session.funcs:checkpoint
        token_threshold: 5000
        model: session-forms-deterministic

  # fixture_agent plus Session steering (wippy.session.traits:steering): the
  # user can type while a turn runs, so visible tests can check steering and
  # form answers together (answers are never steered; they keep acceptance
  # order and stay pending until admitted).
  - name: steering_fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-steering-fixture-agent
      type: agent.gen1
      title: Session Forms Steering Fixture
      comment: Deterministic fixture agent with forms and steering — dev fixture, no external calls
      icon: tabler:message-plus
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent with steering, used
      for demos and tests. Say "ask me" to receive a delivery-preference form;
      you can keep typing while a turn runs.
    model: session-forms-deterministic
    max_tokens: 4096
    traits:
      - id: wippy.session.forms:ask_user
      - id: wippy.session.traits:steering
    agent_options:
      checkpoint:
        function_id: wippy.session.funcs:checkpoint
        token_threshold: 5000
        model: session-forms-deterministic

  # Same deterministic provider/model as fixture_agent, but WITHOUT the
  # forms trait — no ask_user_tool (or read_form_tool) is ever offered to
  # the model. Exercises generate.lua's "no ask_user tool in the request"
  # branch: "ask me" replies "I can't create forms here." instead of
  # issuing a tool call. Still answers form answer rows (the
  # <wippy-form-answers> element's record) normally, since that dispatch only
  # looks at the user text, not the tools list.
  - name: plain_fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-plain-fixture-agent
      type: agent.gen1
      title: Session Forms Plain Fixture
      comment: Deterministic fixture agent without the forms trait — dev fixture, no external calls
      icon: tabler:flask-off
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent used for demos
      and tests, without form support. Say "ask me" and you will be told
      forms are unavailable here; answer a form to get a confirmation.
    model: session-forms-deterministic
    max_tokens: 4096

  - name: touch_artifact
    kind: function.lua
    meta:
      comment: Dev fixture — appends a touch line to an owned artifact's content via artifact_repo, CAS-guarded by content_version
    source: file://touch_artifact.lua
    modules:
      - http
      - security
      - time
      - env
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
      artifact_events: wippy.session.persist:artifact_events
    method: handler
    pool:
      size: 2

  - name: touch_artifact.endpoint
    kind: http.endpoint
    meta:
      router: app:api
      comment: Dev fixture endpoint — see namespace comment. Requires SESSION_FORMS_DEV_FIXTURES=true and the app.security:admin group.
    method: POST
    func: touch_artifact
    path: /session-forms-dev/artifacts/{id}/touch

  # Admin-only gate for touch_artifact.endpoint. Mirrors the deny-policy idiom
  # already used by app.security:user.forbid_registry: app.security:user's
  # app-wide allow ('*'/'*', see src/app/security/_index.yaml) is narrowed back
  # down for this one resource, so only app.security:admin (whose blanket
  # admin.all_access allow is untouched) can reach it. Not a new mechanism.
  - name: touch_artifact.deny_user
    kind: security.policy
    meta:
      comment: Denies app.security:user callers access to the dev fixture endpoint; app.security:admin is unaffected
    groups:
      - app.security:user
    policy:
      resources: app.session_forms_demo:touch_artifact.endpoint
      actions: '*'
      effect: deny
