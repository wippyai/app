# Session Forms dev fixtures. This namespace holds scripted agents, a
# deterministic model and an admin-only endpoint that edits an artifact.
# .wippy.yaml removes it unless the session-forms-fixtures profile is selected
# (see README.md), and the endpoint also needs SESSION_FORMS_DEV_FIXTURES=true.
version: "1.0"
namespace: app.session_forms_demo

entries:
  - name: generate
    kind: function.lua
    meta:
      type: llm_function
      comment: Deterministic Session Forms demo generator
    source: file://generate.lua
    modules:
      - json
      - time
    imports: {}
    method: handler

  - name: status
    kind: function.lua
    meta:
      type: llm_function
      comment: Deterministic Session Forms demo provider status
    source: file://status.lua
    modules: []
    imports: {}
    method: handler

  - name: driver
    kind: contract.binding
    meta:
      name: Session Forms demo driver
      comment: Local deterministic provider used by the Session Forms demo fixture agents
      tags:
        - session-forms
        - fixture
    contracts:
      - contract: wippy.llm:generator
        methods:
          generate: app.session_forms_demo:generate
      - contract: wippy.llm:provider
        methods:
          status: app.session_forms_demo:status

  - name: provider
    kind: registry.entry
    meta:
      name: session-forms-demo
      type: llm.provider
      title: Session Forms Demo
      comment: Deterministic local provider for the Session Forms demo fixture agents
      tags:
        - session-forms
        - fixture
    driver:
      id: app.session_forms_demo:driver
      options: {}

  - name: model
    kind: registry.entry
    meta:
      name: session-forms-deterministic
      type: llm.model
      title: Session Forms Deterministic
      comment: Deterministic model that exercises the ask_user and ask_user_fields form flows without a real LLM
      capabilities:
        - generate
        - tool_use
      class:
        - session-forms-fixture
      priority: 100
    max_tokens: 32768
    output_tokens: 4096
    providers:
      - id: app.session_forms_demo:provider
        provider_model: session-forms-deterministic

  # Fixture tools for the two-round phrases in generate.lua ("slow tool",
  # "fail after text", "limit after text", "artifact and ask"). Only the
  # fixture agents below use them.
  - name: slow_job_tool
    kind: function.lua
    meta:
      type: tool
      title: Slow Job
      comment: Fixture tool that sleeps 25 seconds, so a test can stop or Stop the session while it runs
      llm_alias: slow_job
      llm_description: Runs a slow fixture job and returns when it is done.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "job": { "type": "string", "description": "Name of the job." }
          }
        }
    source: file://jobs.lua
    modules:
      - time
    method: slow_job
    pool:
      size: 4

  - name: quick_job_tool
    kind: function.lua
    meta:
      type: tool
      title: Quick Job
      comment: Fixture tool that returns at once
      llm_alias: quick_job
      llm_description: Runs a quick fixture job and returns when it is done.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "job": { "type": "string", "description": "Name of the job." }
          }
        }
    source: file://jobs.lua
    modules:
      - time
    method: quick_job
    pool:
      size: 2

  - name: note_tool
    kind: function.lua
    meta:
      type: tool
      title: Make Note
      comment: Fixture tool that returns an inline artifact
      llm_alias: make_note
      llm_description: Saves a short note as an inline artifact.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "topic": { "type": "string", "description": "Topic of the note." }
          }
        }
    source: file://jobs.lua
    modules:
      - time
    method: make_note
    pool:
      size: 2

  - name: fixture_jobs
    kind: registry.entry
    meta:
      type: agent.trait
      title: Session Forms Fixture Jobs
      comment: Offers the fixture tools to a fixture agent
      tags:
        - session-forms
        - fixture
    prompt: |
      The fixture tools slow_job, quick_job and make_note are used only by
      scripted phrases. The scripted model calls them; do not call them.
    tools:
      - app.session_forms_demo:slow_job_tool
      - app.session_forms_demo:quick_job_tool
      - app.session_forms_demo:note_tool

  # The checkpoint options apply to the agent that sets them, so other agents
  # keep the default checkpoint behavior. They set a 5000 token threshold and
  # use the fixture model for the summary.
  # The agent has both forms traits because it exercises both tools, and a
  # real agent should have only one of them.
  - name: fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-fixture-agent
      type: agent.gen1
      title: Session Forms Fixture
      comment: Deterministic fixture agent for the Session Forms demo
      icon: tabler:flask
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent used for demos
      and tests. Say "ask me" to receive a delivery-preference form, or
      answer one to get a confirmation.
    model: session-forms-deterministic
    max_tokens: 4096
    traits:
      - id: wippy.session.forms:ask_user
      - id: wippy.session.forms:ask_user_fields
      - id: app.session_forms_demo:fixture_jobs
    agent_options:
      checkpoint:
        function_id: wippy.session.funcs:checkpoint
        token_threshold: 5000
        model: session-forms-deterministic

  # fixture_agent plus the Session steering trait, so the user can type while a
  # turn runs and tests can check steering together with form answers. It has
  # only the ask_user trait, so "ask me delivery via ask_user" shows the server
  # refusing a form with standard fields on ask_user.
  - name: steering_fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-steering-fixture-agent
      type: agent.gen1
      title: Session Forms Steering Fixture
      comment: Deterministic fixture agent with forms and steering
      icon: tabler:message-plus
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent with steering, used
      for demos and tests. Say "ask me" to receive a delivery-preference form;
      you can keep typing while a turn runs.
    model: session-forms-deterministic
    max_tokens: 4096
    traits:
      - id: wippy.session.forms:ask_user
      - id: wippy.session.traits:steering
      - id: app.session_forms_demo:fixture_jobs
    agent_options:
      checkpoint:
        function_id: wippy.session.funcs:checkpoint
        token_threshold: 5000
        model: session-forms-deterministic

  # fixture_agent with a turn limit of one model step, so "limit after text"
  # writes its text and calls a tool, and the next step hits the limit.
  - name: limit_fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-limit-fixture-agent
      type: agent.gen1
      title: Session Forms Limit Fixture
      comment: Deterministic fixture agent whose turn allows one model step
      icon: tabler:gauge
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent with a turn limit
      of one step, used for demos and tests. Say "limit after text" to reach
      the limit after a short preamble.
    model: session-forms-deterministic
    max_tokens: 4096
    traits:
      - id: wippy.session.forms:ask_user
      - id: app.session_forms_demo:fixture_jobs
    agent_options:
      loop:
        max_iterations: 1
      checkpoint:
        function_id: wippy.session.funcs:checkpoint
        token_threshold: 5000
        model: session-forms-deterministic

  # fixture_agent without a forms trait, so the model is offered no form tool.
  # "ask me" then replies that it can't create forms, and form answers are
  # still handled.
  - name: plain_fixture_agent
    kind: registry.entry
    meta:
      name: session-forms-plain-fixture-agent
      type: agent.gen1
      title: Session Forms Plain Fixture
      comment: Deterministic fixture agent without the forms trait
      icon: tabler:flask-off
      group: Test fixtures
      class:
        - public
    prompt: |
      You are the deterministic Session Forms fixture agent used for demos
      and tests, without form support. Say "ask me" and you will be told
      forms are unavailable here; answer a form to get a confirmation.
    model: session-forms-deterministic
    max_tokens: 4096

  - name: touch_artifact
    kind: function.lua
    meta:
      comment: Appends a line to the content of an artifact the caller owns, and fails if the artifact changed since it was read
    source: file://touch_artifact.lua
    modules:
      - http
      - security
      - time
      - env
    imports:
      artifact_repo: wippy.session.persist:artifact_repo
      artifact_events: wippy.session.persist:artifact_events
    method: handler
    pool:
      size: 2

  - name: touch_artifact.endpoint
    kind: http.endpoint
    meta:
      router: app:api
      comment: Test-only endpoint that edits an artifact. Requires SESSION_FORMS_DEV_FIXTURES=true and the app.security:admin group.
    method: POST
    func: touch_artifact
    path: /session-forms-dev/artifacts/{id}/touch

  # Denies app.security:user so only admins can reach the endpoint.
  - name: touch_artifact.deny_user
    kind: security.policy
    meta:
      comment: Denies app.security:user callers access to the touch endpoint; app.security:admin is unaffected
    groups:
      - app.security:user
    policy:
      resources: app.session_forms_demo:touch_artifact.endpoint
      actions: '*'
      effect: deny
