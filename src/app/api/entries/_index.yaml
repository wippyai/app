version: "1.0"
namespace: app.api.entries

entries:
  - name: list_agents
    kind: function.lua
    source: file://list_agents.lua
    modules:
      - http
      - registry
    imports:
      start_tokens: wippy.session:start_tokens
    method: handler
    pool:
      size: 2

  - name: list_agents.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: list_agents
    path: /agents/list

  - name: agents_by_name
    kind: function.lua
    meta:
      comment: Gets agent titles by their names
      router: app:api
    source: file://agents_by_name.lua
    modules:
      - http
      - json
      - registry
    method: handler
    pool:
      size: 2

  - name: agents_by_name.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: agents_by_name
    path: /agents/by-name

  - name: agents_details
    kind: function.lua
    meta:
      comment: Gets one agent's details for the Web Host composer (start prompts)
      router: app:api
    source: file://agents_details.lua
    modules:
      - http
    imports:
      agent_registry: wippy.agent.discovery:registry
    method: handler
    pool:
      size: 2

  - name: agents_details.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: agents_details
    path: /agents/details

  - name: tools_by_name
    kind: function.lua
    meta:
      comment: Gets tool titles by the names that tool calls carry
      router: app:api
    source: file://tools_by_name.lua
    modules:
      - http
      - registry
    imports:
      tools: wippy.agent.discovery:tools
    method: handler
    pool:
      size: 2

  - name: tools_by_name.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: tools_by_name
    path: /tools/by-name

  - name: list_models
    kind: function.lua
    meta:
      comment: Lists all available models
      router: app:api
    source: file://list_models.lua
    modules:
      - http
      - json
    imports:
      models: wippy.llm.discovery:models
    method: handler
    pool:
      size: 2

  - name: list_models.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: list_models
    path: /models/list

  - name: models_by_name
    kind: function.lua
    meta:
      comment: Gets model information by their names
      router: app:api
    source: file://models_by_name.lua
    modules:
      - http
      - json
    imports:
      models: wippy.llm.discovery:models
    method: handler
    pool:
      size: 2

  - name: models_by_name.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: models_by_name
    path: /models/by-name
