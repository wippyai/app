version: "1.0"
namespace: app.security

entries:
  # Queue deliveries have no request actor. Give only the upload worker the
  # permissions needed to load uploads and run app-declared processing stages.
  - name: upload_worker_execution_security
    kind: ns.requirement
    targets:
      - entry: userspace.uploads:process_worker
        path: .security
    default:
      actor:
        id: app.security:upload_worker
      policies:
        - app.security:upload_worker.env_read
        - app.security:upload_worker.database
        - app.security:upload_worker.pipeline
        - app.security:upload_worker.actor
        - app.security:upload_worker.context
        - app.security:upload_worker.security
        - app.security:upload_worker.notifications

  - name: upload_worker.env_read
    kind: security.policy
    policy:
      resources: userspace.uploads.env:database_resource
      actions:
        - env.get
      effect: allow

  - name: upload_worker.database
    kind: security.policy
    policy:
      resources: app:db
      actions:
        - db.get
      effect: allow

  - name: upload_worker.pipeline
    kind: security.policy
    policy:
      resources: '*'
      actions:
        - registry.get
        - funcs.call
      conditions:
        - field: resource
          operator: matches
          value: '^app(\.[^:]+)?:[^:]+$'
      effect: allow

  - name: upload_worker.actor
    kind: security.policy
    policy:
      resources: '*'
      actions:
        - security.actor.create
      effect: allow

  - name: upload_worker.context
    kind: security.policy
    policy:
      resources: context
      actions:
        - funcs.context
      effect: allow

  - name: upload_worker.security
    kind: security.policy
    policy:
      resources: security
      actions:
        - funcs.security
      effect: allow

  - name: upload_worker.notifications
    kind: security.policy
    policy:
      # process.send checks the resolved PID, whose host is app:processes.
      resources: '*'
      actions:
        - process.send
      conditions:
        - field: resource
          operator: matches
          value: '^\{[^@{}]+@app:processes\|[^{}]+\}$'
      effect: allow

  # Login is public, so token_auth cannot supply an actor before credentials
  # are verified. Configure only this function, leaving router/user scopes alone.
  - name: login_execution_security
    kind: ns.requirement
    targets:
      - entry: userspace.user.api:login
        path: .security
    default:
      actor:
        id: app.security:login_ingress
      policies:
        - app.security:login.env_read
        - app.security:login.database
        - app.security:login.scopes
        - app.security:login.actor
        - app.security:login.tokens

  - name: login.env_read
    kind: security.policy
    policy:
      resources:
        - userspace.user.env:database_resource
        - userspace.user.env:admin_group_id
        - userspace.user.env:default_group_id
        - userspace.user.env:admin_init_enabled
        - userspace.user.env:token_expiration
      actions:
        - env.get
      effect: allow

  - name: login.database
    kind: security.policy
    policy:
      resources: app:db
      actions:
        - db.get
      effect: allow

  - name: login.scopes
    kind: security.policy
    policy:
      resources:
        - app.security:admin
        - app.security:user
      actions:
        - security.policy_group.get
      effect: allow

  - name: login.actor
    kind: security.policy
    policy:
      resources: '*'
      actions:
        - security.actor.create
      effect: allow

  - name: login.tokens
    kind: security.policy
    policy:
      resources: userspace.user.security:tokens
      actions:
        - security.token_store.get
        - security.token.create
      effect: allow

  - name: admin.all_access
    kind: security.policy
    groups:
      - app.security:admin
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: ingress.forbid_registry
    kind: security.policy
    groups:
      - app.security:ingress
    policy:
      resources: '*'
      actions: '*'
      conditions:
        - field: action
          operator: matches
          value: ^registry\.apply\.*$
      effect: deny

  - name: ingress.general_access
    kind: security.policy
    groups:
      - app.security:ingress
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: session
    kind: store.memory
    cleanup_interval: 10m
    lifecycle:
      auto_start: true
    max_size: 5000

  - name: tokens
    kind: security.token_store
    default_expiration: 24h
    store: app.security:session
    token_key: ${ENV_TOKEN_KEY:-wippy-auth-key}
    token_length: 32

  - name: user.forbid_registry
    kind: security.policy
    groups:
      - app.security:user
    policy:
      resources: '*'
      actions: '*'
      conditions:
        - field: action
          operator: matches
          value: ^registry\.apply.*$
      effect: deny

  - name: user.general_access
    kind: security.policy
    groups:
      - app.security:user
    policy:
      resources: '*'
      actions: '*'
      effect: allow
