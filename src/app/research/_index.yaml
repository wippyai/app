version: "1.0"
namespace: app.research

# The Researcher agent: an LLM agent that answers a request by building a dashboard of this app's
# data. It has the three dashboards tools and nothing else (RC1-20): DashboardCatalogue to learn what
# exists, PreviewDataPoint to see what a point returns, and BuildDashboard to publish the pages. It
# does not include the dashboards trait, so it sees no catalogue in its prompt and must call the
# catalogue tool itself. e2e/dashboards-discovery.spec.ts runs it through the research endpoint.
# The web fetch trait and tool below are kept for the web research example; no agent uses them now.
# Layout: agent first, then the trait + tool it used to use, then the run endpoint.

entries:
  # The researcher. Plans a dashboard from the catalogue and builds it.
  - name: researcher
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Researcher
      comment: Investigates a request about this app's data and builds a dashboard that answers it
      icon: tabler:world-search
    prompt: |
      You investigate a request about the data of this app and answer it with a dashboard page.
      You have three tools and nothing else:
        - DashboardCatalogue lists what exists: the data points (with their arguments, output and
          example), the tiles that can show them, and the mappers. Call it first, with `kind` and a
          short `query` taken from the request.
        - PreviewDataPoint runs one point from the catalogue and shows what it returns.
        - BuildDashboard builds and publishes the page from a request that uses only ids from the
          catalogue. Use rows of tile ids, no widths. If it returns errors, fix them and call it again.
      Look at the catalogue before you plan. Use only point, tile and mapper ids that it lists.
      When the page is built, write one or two sentences about what it shows and the page link,
      exactly as BuildDashboard gives it. A separate step turns your notes into the final answer.
    model: class:fast
    temperature: 0.2
    max_tokens: 8000
    tools:
      - wippy.dashboards.agent:catalogue
      - wippy.dashboards.agent:preview_point
      - wippy.dashboards.agent:build_dashboard

  - name: web_research_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: Web Research
      tags:
        - web
    prompt: |
      Use WebGet to fetch pages over HTTP. Each fetch streams live to the user.
    tools:
      - app.research:web_get

  # The web tool the agent calls: HTTP GET, plus a realtime event to the user.
  - name: web_get
    kind: function.lua
    meta:
      type: tool
      title: Web Fetch
      input_schema: |
        {
          "type": "object",
          "properties": {
            "url": { "type": "string", "description": "Absolute http(s) URL to fetch" }
          },
          "required": ["url"],
          "additionalProperties": false
        }
      llm_alias: WebGet
      llm_description: Fetch a web page over HTTP GET; returns its title and text. Also streams a live event to the user's Web Research panel.
    source: file://web_get.lua
    modules:
      - http_client
      - html
      - security
      - time
    method: handler
    pool:
      size: 2

  # Final workflow node: llm.generate turns the agent's notes into the answer
  # and pushes it to the user live.
  - name: format
    kind: function.lua
    meta:
      comment: Format research notes into the final answer and stream it to the user
    source: file://format.lua
    modules:
      - security
    imports:
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt
    method: handler

  # Starts the async research workflow for a query (non-blocking).
  - name: run
    kind: function.lua
    meta:
      comment: Run the research agent for a query via a dataflow, return its answer
    source: file://run.lua
    modules:
      - http
      - json
    imports:
      flow: userspace.dataflow.flow:flow
    method: handler

  - name: run.endpoint
    kind: http.endpoint
    meta:
      comment: POST a research query, get back an LLM answer; fetches stream live
      router: app:api
    method: POST
    func: run
    path: /research
