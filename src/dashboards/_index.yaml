version: "1.0"
namespace: wippy.dashboards

entries:
  # ── storage ──────────────────────────────────────────────────────────
  - name: 01_create_dash_pages
    kind: function.lua
    meta:
      description: Create the dash_pages table (stored page specs)
      type: migration
      target_db: app:db
      tags:
        - dashboards
      timestamp: "2026-11-09T12:00:00Z"
    source: file://migrations/01_create_dash_pages.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  # ── security ─────────────────────────────────────────────────────────
  # The registry.apply check cannot be scoped to a namespace (contracts
  # section 13), so publication is gated by this action, and the generator
  # refuses in code any change outside wippy.dashboards.pages.
  - name: deny_publish_user
    kind: security.policy
    meta:
      comment: app.security:user may not publish dashboard pages
    groups:
      - app.security:user
    policy:
      resources: wippy.dashboards:pages
      actions: dashboards.publish
      effect: deny

  # Test page for denial checks (stage B1 acceptance 4).
  - name: deny_view_check
    kind: security.policy
    meta:
      comment: app.security:user may not view the page deny_check
    groups:
      - app.security:user
    policy:
      resources: page:wippy.dashboards.pages:deny_check
      actions: view
      effect: deny

  # ── libraries ────────────────────────────────────────────────────────
  - name: spec
    kind: library.lua
    meta:
      comment: Page spec validation (contracts sections 3, 4, 5) and route rules
    source: file://spec.lua
    modules:
      - registry

  - name: compile
    kind: library.lua
    meta:
      comment: Compiles a stored page spec into the props of dashboard-layout (contracts section 6)
    source: file://compile.lua
    modules:
      - security
    imports:
      spec: wippy.dashboards:spec

  - name: shape
    kind: library.lua
    meta:
      comment: Checks a point's output against its declared shape (contracts section 7)
    source: file://shape.lua
    modules:
      - json

  - name: generator
    kind: library.lua
    meta:
      comment: Writes the view.page entry of a published page, only inside wippy.dashboards.pages
    source: file://generator.lua
    modules:
      - registry
    imports:
      spec: wippy.dashboards:spec

  # ── endpoints ────────────────────────────────────────────────────────
  - name: publish
    kind: library.lua
    meta:
      comment: Validates, stores and publishes one page spec; used by the publish endpoint and by Lua callers
    source: file://publish.lua
    modules:
      - json
      - security
      - sql
    imports:
      spec: wippy.dashboards:spec
      generator: wippy.dashboards:generator

  - name: publish_page
    kind: function.lua
    source: file://publish_page.lua
    method: handler
    modules:
      - http
    imports:
      publish: wippy.dashboards:publish
    pool:
      size: 2

  - name: publish_page.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: publish_page
    path: /dashboards/pages

  - name: page_props
    kind: function.lua
    source: file://page_props.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - registry
    imports:
      compile: wippy.dashboards:compile
      spec: wippy.dashboards:spec
    pool:
      size: 4

  - name: page_props.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: page_props
    path: /dashboards/pages/{id}/props

  - name: read_point
    kind: function.lua
    source: file://read_point.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - registry
      - funcs
      - logger
    imports:
      spec: wippy.dashboards:spec
      shape: wippy.dashboards:shape
      args: wippy.dashboards:args
    pool:
      size: 4

  - name: read_point.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: read_point
    path: /dashboards/pages/{id}/points/{point}

  # ── stage E3: actions ────────────────────────────────────────────────
  - name: 02_create_dash_action_log
    kind: function.lua
    meta:
      description: Create the dash_action_log table (idempotency and audit record of actions)
      type: migration
      target_db: app:db
      tags:
        - dashboards
      timestamp: "2026-11-09T18:00:00Z"
    source: file://migrations/02_create_dash_action_log.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  - name: args
    kind: library.lua
    meta:
      comment: Splits a page's declared args into constants and $param-bound keys (contracts section 4)
    source: file://args.lua

  - name: action_log
    kind: library.lua
    meta:
      comment: dash_action_log rows (contracts section 10); begin() stores the record before an action runs
    source: file://action_log.lua
    modules:
      - json
      - hash

  - name: run_action
    kind: function.lua
    source: file://run_action.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - registry
      - funcs
      - logger
    imports:
      spec: wippy.dashboards:spec
      shape: wippy.dashboards:shape
      args: wippy.dashboards:args
      action_log: wippy.dashboards:action_log
    # A lazy pool runs calls side by side. The default pool is inline, so one slow action would make every
    # other request wait, and two calls with one key could never overlap.
    pool:
      type: lazy
      max_size: 8

  - name: run_action.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: run_action
    path: /dashboards/pages/{id}/actions/{action}

  # Removes a published page: its row, its view.page entry, its route and nav item.
  - name: unpublish
    kind: function.lua
    meta:
      comment: DELETE a dashboard page (same permission as publishing)
    source: file://unpublish.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - logger
    imports:
      spec: wippy.dashboards:spec
      generator: wippy.dashboards:generator

  - name: unpublish.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: DELETE
    func: unpublish
    path: /dashboards/pages/{id}

  # ── restore on start (spec 9.1) ──────────────────────────────────────
  # Runtime entries are lost on restart; this service re-writes the view.page
  # entry of every published page when the app starts, through the generator,
  # which refuses any change outside wippy.dashboards.pages.
  - name: restore
    kind: process.lua
    meta:
      comment: Re-writes the view.page entries of the stored published pages, then waits
    source: file://restore.lua
    method: main
    modules:
      - sql
      - json
      - logger
    imports:
      generator: wippy.dashboards:generator

  - name: restore_service
    kind: process.service
    meta:
      comment: Starts the page restore once the database and process host run
    process: wippy.dashboards:restore
    host: app:processes
    lifecycle:
      auto_start: true
      depends_on:
        - app:processes
        - app:db
      security:
        actor:
          id: wippy.dashboards.restore
        groups:
          - wippy.dashboards:restorer

  # The restore actor may apply registry changes; the generator limits them to
  # wippy.dashboards.pages in code, because registry.apply cannot be scoped.
  - name: restorer_registry
    kind: security.policy
    meta:
      comment: The page restore service may change the registry
    groups:
      - wippy.dashboards:restorer
    policy:
      resources: '*'
      actions: '*'
      effect: allow
