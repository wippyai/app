version: "1.0"
namespace: demo.user_status

# Plugin 2 of the dashboards proof of concept (stage E2): the tile `user-status`
# with its point, its live signal and its test endpoint, as one module.
#   point       demo.user_status:users        wippy.dashboards.point, served by list_users
#   component   demo.user_status:user-status  view.component, frontend/web-components/user-status;
#                                             its meta.implements is the tile claim of the tile demo.user_status
#   signal      topic dash:users:changed      sent by publish_signal through live.signal; POST /api/v1/demo/signal/users
#   action      demo.user_status:set_status   wippy.dashboards.action, served by set_user_status (stage E3)
#
# The JSON schema of the users object appears twice below: as the point's output
# schema and as the tile's input schema. The unit test in
# frontend/web-components/user-status (schema.test.ts) fails when the two differ,
# or when the saved output of list_users does not match them.

entries:
  # ── function of the point ────────────────────────────────────────────
  - name: list_users
    kind: function.lua
    meta:
      comment: Lists the users with status and groups for the user-status tile
    source: file://list_users.lua
    method: list
    imports:
      user_repo: userspace.user.persist:user_repo
      user_groups_repo: userspace.user.persist:user_groups_repo
    pool:
      size: 2

  # ── point declaration (contracts section 5.1) ────────────────────────
  - name: users
    kind: registry.entry
    meta:
      type: wippy.dashboards.point
      title: Users
      description: The users of the app with their status and groups. Use it for a team overview.
      func: demo.user_status:list_users
      live_read: true
      args_schema: { type: object, additionalProperties: false, properties: {} }
      example:
        args: {}
        data:
          users:
            - { user_id: "u1", name: "Ada Lovelace", status: active, groups: [admin] }
            - { user_id: "u2", name: "Linus Torvalds", status: inactive, groups: [user] }
      output:
        shape: schema
        schema:
          type: object
          additionalProperties: false
          required: [users]
          properties:
            users:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [user_id, name, status, groups]
                properties:
                  user_id: { type: string }
                  name: { type: string }
                  status: { type: string, enum: [active, inactive, suspended, pending] }
                  groups: { type: array, items: { type: string } }
      # Real-time contract section 3: a signal to everyone on a fixed topic with
      # no arguments in it, sent through the engine's live library.
      live:
        signal:
          audience: all
          topic: "dash:users:changed"

  # ── web component, with its tile claim (tile contract section 2) ──────
  # The claim replaces the wippy.dashboards.tile entry of version 0.0.1. A page places the tile with
  # only { "type": "demo.user_status" }: the engine adds the default point and action.
  - name: user-status
    kind: registry.entry
    meta:
      type: view.component
      name: user-status
      tag_name: user-status
      implements:
        - interface: "wippy.dashboards:tile_v1"
          version: "1.0.0"
          descriptor:
            tile: demo.user_status
            tile_version: "1.0.0"
            title: User status
            description: Lists the users of the app with their status and groups, and lets an admin set a status. Use it for a team overview.
            inputs:
              main:
                shape: schema
                schema:
                  type: object
                  additionalProperties: false
                  required: [users]
                  properties:
                    users:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [user_id, name, status, groups]
                        properties:
                          user_id: { type: string }
                          name: { type: string }
                          status: { type: string, enum: [active, inactive, suspended, pending] }
                          groups: { type: array, items: { type: string } }
            options_schema:
              type: object
            events: {}
            actions:
              set_status:
                description: Sets the status of one user to active or inactive.
                args:
                  type: object
                  required: [user_id, status]
                  properties:
                    user_id: { type: string }
                    status: { enum: [active, inactive] }
            default_data:
              main: { point: "demo.user_status:users", args: {} }
            default_actions:
              set_status: "demo.user_status:set_status"
            size:
              fit: any
              width: { min: 320 }
              height: { min: 160, preferred: 280 }
            examples:
              main:
                users:
                  - { user_id: "u1", name: "Ada Lovelace", status: active, groups: [admin] }
                  - { user_id: "u2", name: "Linus Torvalds", status: inactive, groups: [user] }
      announced: true
      secure: false
      auto_register: true
      url: /app/wc/user-status
      entry_point: user-status.js

  # ── live signal (contracts section 9) ────────────────────────────────
  - name: publish_signal
    kind: function.lua
    meta:
      comment: Sends the users point's live signal (dash:users:changed, no data) through the engine's live library
    source: file://signal.lua
    method: publish
    modules:
      - http
      - security
      - logger
    imports:
      live: wippy.dashboards:live
    pool:
      size: 1

  - name: signal_handler
    kind: function.lua
    meta:
      comment: POST /api/v1/demo/signal/users, admin only
    source: file://signal.lua
    method: signal_handler
    modules:
      - http
      - security
      - logger
    imports:
      live: wippy.dashboards:live
    pool:
      size: 1

  - name: signal_handler.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: signal_handler
    path: /demo/signal/users

  # Only the admin group may publish the test signal. The user group is denied.
  - name: deny_signal_users
    kind: security.policy
    meta:
      comment: app.security:user may not publish the test signal
    groups:
      - app.security:user
    policy:
      resources: demo.user_status:signal
      actions: demo.signal_users
      effect: deny

  # ── action (stage E3, contracts section 5.2) ─────────────────────────
  # The declaration is demo.user_status:set_status; its function is set_user_status.
  - name: set_user_status
    kind: function.lua
    meta:
      comment: Sets the status of a user (active or inactive); refuses the caller's own account
    source: file://set_status.lua
    method: set_status
    modules:
      - security
      - funcs
      - logger
    imports:
      user_repo: userspace.user.persist:user_repo
    pool:
      size: 2

  - name: set_status
    kind: registry.entry
    meta:
      type: wippy.dashboards.action
      title: Set user status
      description: Sets the status of one user to active or inactive. An admin only; the caller's own account is refused.
      func: demo.user_status:set_user_status
      args_schema:
        type: object
        additionalProperties: false
        required: [user_id, status]
        properties:
          user_id: { type: string }
          status: { enum: [active, inactive] }
      tile_args: [user_id, status]
      result_schema:
        type: object
      permission:
        action: dash.users.set_status
        resource: demo.user_status:users
      confirm: true
      sensitive_fields: []
      refreshes: [users]

  # Only the admin group may set a user status. The user group is denied.
  - name: deny_set_status
    kind: security.policy
    meta:
      comment: app.security:user may not set a user status
    groups:
      - app.security:user
    policy:
      resources: demo.user_status:users
      actions: dash.users.set_status
      effect: deny
